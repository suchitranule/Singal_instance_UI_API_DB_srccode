version: 0.2

env:
  shell: bash
  variables:
    APP_NAME: "fde-task-app"
    # FIX 1: Remove the "s3://" prefix. Keep just the bucket name.
    ARTIFACT_BUCKET: "fde-artifacts"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - node --version
      - aws --version

  pre_build:
    commands:
      - echo "== Validating UI Code =="
      - pwd
      - ls -lrta
      - node --check ui/app.js
      - grep -q '<script src="/app.js"' ui/index.html
      - grep -q '__API_HOST__' ui/nginx.conf.tpl
      - bash -n deploy/common.sh deploy/ui.sh

  build:
    commands:
      - echo "== Packaging UI Artifact =="
      - COMMIT_HASH=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}" | cut -c 1-7)
      - RELEASE_VERSION="$(date -u +%Y%m%d-%H%M%S)-${COMMIT_HASH}"
      - mkdir -p $CODEBUILD_SRC_DIR/dist
      - tar -czf $CODEBUILD_SRC_DIR/dist/ui.tar.gz ui deploy/common.sh deploy/ui.sh
      - zip -r $CODEBUILD_SRC_DIR/dist/ui-artifact.zip ui deploy/common.sh deploy/ui.sh
      # FIX 3: Use absolute paths or cd into the absolute workspace dist path safely
      - ( cd $CODEBUILD_SRC_DIR/dist && sha256sum ui.tar.gz > SHA256SUMS )
      - |
        cat > $CODEBUILD_SRC_DIR/dist/manifest.json <<EOF
        {"component":"ui","version":"${RELEASE_VERSION}","commit":"${COMMIT_HASH}","built_at":"$(date -u +%FT%TZ)"}
        EOF

  post_build:
    commands:
      - echo "== Pushing to S3 =="
      - |
        if [ -n "${ARTIFACT_BUCKET}" ]; then
          # FIX 2: Added back the 'releases/' prefix directory structure to match your target layout
          aws s3 cp $CODEBUILD_SRC_DIR/dist/ "s3://${ARTIFACT_BUCKET}/releases/${RELEASE_VERSION}/" --recursive
          aws s3 cp $CODEBUILD_SRC_DIR/dist/ui-artifact.zip "s3://${ARTIFACT_BUCKET}/ui-artifact.zip"
          echo "${RELEASE_VERSION}" | aws s3 cp - "s3://${ARTIFACT_BUCKET}/releases/ui-LATEST"
        fi

artifacts:
  files:
    - '**/*'
  base-directory: 'dist'
  name: ui-artifact
