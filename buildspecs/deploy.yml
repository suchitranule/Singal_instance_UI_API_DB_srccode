version: 0.2
# Pull artifacts from S3 onto the DB, API, and UI EC2 instances via SSM and deploy.
# Override ROLE (all|ui|api|db) or RELEASE at start-build time if needed.
env:
  shell: bash
  variables:
    APP_NAME: "fde-task-app"
    ARTIFACT_BUCKET: "fde-artifacts"
    AWS_REGION: "ap-south-2"
    ROLE: "all"
    RELEASE: "latest"

phases:
  install:
    runtime-versions:
      python: 3.12
  build:
    commands:
      - bash scripts/deploy.sh
