version: 0.2
# Provision all 3 EC2 instances (DB, API, UI) on Ubuntu 24.04 using AWS CLI.
env:
  shell: bash
  variables:
    APP_NAME: "fde-task-app"
    ARTIFACT_BUCKET: "fde-artifacts"
    AWS_REGION: "ap-south-2"
    ROLE: "all"

phases:
  build:
    commands:
      - aws --version
      - bash scripts/provision.sh
